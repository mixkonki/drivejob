name: PHP Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php83-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php83-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # ENFORCING (Πακέτο 6): level 0 = μηδέν ανύπαρκτες κλάσεις/μεθόδους/μεταβλητές
    - name: Run PHPStan (level 0 — enforcing)
      run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    # ENFORCING (Πακέτο 6): το suite τρέχει — τα DB tests κάνουν skip χωρίς βάση
    - name: Run PHPUnit tests
      run: vendor/bin/phpunit --testsuite Unit

    # Report-only: style (θα σφίξει όταν περάσει phpcbf σε όλο το δέντρο)
    - name: Run PHPCS (report-only)
      continue-on-error: true
      run: vendor/bin/phpcs
