# Αυτόματο deploy στην παραγωγή (netmind/StackCP)
#
# Σε κάθε push στο main, το GitHub συνδέεται με SSH στον server και
# τρέχει ό,τι έτρεχες μέχρι τώρα με το χέρι: cd ~/drivejob && git pull.
#
# Χρησιμοποιεί fetch + reset --hard origin/main αντί για σκέτο pull:
# είναι η ίδια εντολή που έχουμε ήδη ως «επανόρθωση» στο runbook —
# αν κατά λάθος υπάρχει τοπικό commit στον server, το deploy δεν
# κολλάει, απλώς επαναφέρει τον κώδικα στο main. Τα .env, logs/,
# storage/, vendor/ δεν αγγίζονται (είναι εκτός git).
#
# Απαιτεί ΕΝΑ secret στο GitHub: DEPLOY_SSH_KEY (ιδιωτικό κλειδί SSH
# αποκλειστικά για deploy — οδηγίες στη συνομιλία / project doc).
#
# Migrations (25/08/2026): μετά το reset τρέχει το database/migrate.php,
# που εκτελεί ΜΟΝΟ τα νέα αρχεία του database/migrations/auto/ (μητρώο
# schema_migrations, idempotent scripts). Αν κάποιο αποτύχει, το deploy
# κοκκινίζει. Τα παλιά/βοηθητικά scripts του migrations/ μένουν χειροκίνητα.

name: Deploy σε παραγωγή

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # και χειροκίνητα, από την καρτέλα Actions

concurrency:
  group: production-deploy
  cancel-in-progress: false   # δύο γρήγορα push → τα deploy μπαίνουν στη σειρά

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ρύθμιση κλειδιού SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ssh.gb.stackcp.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ενημέρωση κώδικα στον server
        # Reset στο ΣΥΓΚΕΚΡΙΜΕΝΟ commit του push (github.sha), όχι στο
        # origin/main: σε παλιότερα git το «fetch origin main» δεν
        # ενημερώνει το origin/main, οπότε το reset πετύχαινε…
        # επαναφέροντας τον ΠΑΛΙΟ κώδικα — πράσινο deploy, μηδέν αλλαγές.
        # Στο τέλος επιβεβαιώνεται ότι το HEAD είναι όντως το ζητούμενο.
        # Η ΑΠΟΜΑΚΡΥΣΜΕΝΗ εντολή σε ΜΙΑ γραμμή με && — το SSH του 20i ενώνει
        # τις γραμμές σε μία, οπότε πολυγραμμικά if/then/fi σκάνε.
        # 3 προσπάθειες με παύση: το gateway του 20i κλείνει περιστασιακά
        # τη σύνδεση (rate limiting) πριν την αυθεντικοποίηση.
        run: |
          for i in 1 2 3; do
            if ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key drivejob.gr@ssh.gb.stackcp.com "cd ~/drivejob && git fetch origin main && git reset --hard ${{ github.sha }} && test \"\$(git rev-parse HEAD)\" = \"${{ github.sha }}\" && /usr/php83/usr/bin/php database/migrate.php && echo \"Παραγωγή στο commit: \$(git rev-parse --short HEAD)\""; then
              exit 0
            fi
            echo "Προσπάθεια $i απέτυχε — νέα προσπάθεια σε 20 δευτερόλεπτα..."
            sleep 20
          done
          echo "Το deploy απέτυχε και στις 3 προσπάθειες" >&2
          exit 1

      # ══════════════════════════════════════════════════════════════════
      #  ΕΛΕΓΧΟΣ ΥΓΕΙΑΣ — ΑΠΟ ΜΕΣΑ, ΟΧΙ ΑΠΟ ΕΞΩ (31/08/2026)
      # ══════════════════════════════════════════════════════════════════
      #
      # Ο παλιός έλεγχος ήταν `curl -fsS https://drivejob.gr/health` και
      # κοκκίνισε με 401. Η αιτία ΔΕΝ ήταν η εφαρμογή: ο HealthController
      # δεν έχει κανέναν έλεγχο πρόσβασης και επιστρέφει μόνο 200 ή 503.
      # Την ίδια στιγμή, από οικιακή σύνδεση, το ίδιο URL έδινε 200.
      #
      # Το 401 ερχόταν από το firewall/CDN του παρόχου, που μπλοκάρει IP
      # κέντρων δεδομένων — και τα GitHub Actions runners τρέχουν σε Azure.
      #
      # Δεν βάλαμε `|| true`: ένας έλεγχος που δεν αποτυγχάνει ποτέ είναι
      # χειρότερος από κανέναν. Ο έλεγχος τρέχει τώρα ΜΕΣΑ στον server,
      # όπου δεν υπάρχει firewall στη μέση, και ελέγχει ένα παραπάνω:
      # ότι όλα τα migrations έχουν όντως εκτελεστεί.
      - name: Έλεγχος υγείας (μέσα από τον server)
        run: |
          ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key drivejob.gr@ssh.gb.stackcp.com \
            "cd ~/drivejob && /usr/php83/usr/bin/php bin/health-cli.php"

      # Το site απαντά και προς τα έξω; Χρήσιμη πληροφορία, αλλά ΔΕΝ
      # κοκκινίζει το deploy: ένα 401 από firewall δεν σημαίνει σπασμένη
      # εφαρμογή, και το είδαμε στην πράξη.
      - name: Εξωτερική απόκριση (πληροφοριακό)
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://drivejob.gr/health || echo "000")
          echo "Το drivejob.gr/health απάντησε: $code"
          if [ "$code" = "200" ]; then
            echo "✓ Το site απαντά κανονικά και από το διαδίκτυο."
          else
            echo "⚠ Μη αναμενόμενος κωδικός από εξωτερικό δίκτυο."
            echo "  Αν ο εσωτερικός έλεγχος πέρασε, το πιθανότερο είναι"
            echo "  φιλτράρισμα IP κέντρου δεδομένων από τον πάροχο."
          fi
